[project]
name = "restaurant-apps-platform"
version = "0.1.0"
description = "Plataforma SaaS de alta performance e escalabilidade em Microsserviços para Gestão de Restaurantes"
readme = "docs/README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
    "workers",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Artefatos gerados pelo tooling do Flutter (`flutter create`/`pod install`),
# regenerados a cada build — não são código-fonte do time, não devem ser lintados.
extend-exclude = ["apps/*/ios/Flutter/ephemeral", "apps/*/**/.dart_tool"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
# E501: comprimento de linha já garantido pelo `ruff format`.
# N818: convenção deliberada do projeto — hierarquia de exceções de domínio
#       (docs/ai/patterns.md) usa o sufixo "Exception" (terminologia DDD), não "Error".
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]  # valores literais em asserts de teste são esperados e legíveis

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
# Sem __init__.py em nenhum serviço/pacote (namespace packages), cada `src/`
# é resolvido como pacote via `explicit_package_bases` + `mypy_path` listando
# a raiz de cada serviço/pacote. Sem isso, mypy atribui identidades de módulo
# DIFERENTES ao mesmo arquivo dependendo de ser alcançado por scan direto
# (ex: "sqlalchemy_category_repository") ou por `from src.x.y import z`
# (ex: "src.x.y.sqlalchemy_category_repository") — o import então resolve
# para um módulo "diferente" e silenciosamente vira `Any` (mascarado por
# `ignore_missing_imports`), invalidando a checagem de tipos entre arquivos.
#
# Serviços apontam para a RAIZ do serviço (import é `from src.x.y import z`,
# com "src" aninhado sob ela). Packages apontam direto para `src/` (import é
# `restaurant_core`/`restaurant_database`/etc., SEM prefixo "src.") — apontar
# um package para sua raiz (sem "/src") causaria descoberta duplicada do
# mesmo arquivo sob dois nomes de módulo ("packages.x.src.restaurant_x.y" e
# "restaurant_x.y").
explicit_package_bases = true
mypy_path = [
    "packages/core/src",
    "packages/security/src",
    "packages/database/src",
    "packages/common/src",
    "packages/events/src",
    "services/auth-service",
    "services/restaurant-service",
    "services/menu-service",
    "services/dining-service",
    "services/order-service",
    "services/kitchen-service",
    "services/inventory-service",
    "services/payment-service",
    "services/delivery-service",
    "services/marketing-service",
    "services/notification-service",
    "services/analytics-service",
    "workers",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
