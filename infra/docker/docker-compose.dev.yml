  # --- Workers (Dramatiq/Redis — ADR-002) -----------------------------------
  # Três processos da mesma imagem (`workers/Dockerfile`), com `command:`
  # diferente cada: o worker Dramatiq processa a fila; a bridge liga o evento
  # `notification.requested` (RabbitMQ/Saga) ao Dramatiq; o agendador dispara
  # o relatório diário via APScheduler.
  dramatiq-worker:
    build:
      context: ../..
      dockerfile: workers/Dockerfile
    container_name: dramatiq-worker
    restart: unless-stopped
    env_file:
      - ../../.env.dev
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - REDIS__HOST=${REDIS_HOST}
      - REDIS__PORT=${REDIS_PORT}
      - REDIS__DB=${WORKERS_REDIS_DB}
      - RABBITMQ__HOST=${RABBITMQ_HOST}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USER=${RABBITMQ_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASS}
    volumes:
      - ../../workers/src:/app/workers/src:ro
    command: ["dramatiq", "src.async_tasks", "--processes", "1", "--threads", "4", "--watch", "src"]
    depends_on:
      redis-cache:
        condition: service_healthy

  notification-bridge:
    build:
      context: ../..
      dockerfile: workers/Dockerfile
    container_name: notification-bridge
    restart: unless-stopped
    env_file:
      - ../../.env.dev
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - REDIS__HOST=${REDIS_HOST}
      - REDIS__PORT=${REDIS_PORT}
      - REDIS__DB=${WORKERS_REDIS_DB}
      - RABBITMQ__HOST=${RABBITMQ_HOST}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USER=${RABBITMQ_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASS}
    volumes:
      - ../../workers/src:/app/workers/src:ro
    command: ["python", "-m", "src.consumers.notification_bridge"]
    depends_on:
      redis-cache:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  scheduler:
    build:
      context: ../..
      dockerfile: workers/Dockerfile
    container_name: scheduler
    restart: unless-stopped
    env_file:
      - ../../.env.dev
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - REDIS__HOST=${REDIS_HOST}
      - REDIS__PORT=${REDIS_PORT}
      - REDIS__DB=${WORKERS_REDIS_DB}
      - RABBITMQ__HOST=${RABBITMQ_HOST}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USER=${RABBITMQ_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASS}
    volumes:
      - ../../workers/src:/app/workers/src:ro
    command: ["python", "-m", "src.schedulers.daily_report_scheduler"]
    depends_on:
      redis-cache:
        condition: service_healthy

volumes:
  postgres_data_dev:
  redis_data_dev:
  meili_data_dev:
  rabbitmq_data_dev:
