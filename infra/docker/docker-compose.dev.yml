# =============================================================================
# DOCKER COMPOSE — AMBIENTE DE DESENVOLVIMENTO — RESTAURANT APPS PLATFORM
# =============================================================================
# Sobe TODA a infraestrutura localmente (Postgres, Redis, RabbitMQ,
# Meilisearch) + os 12 microsserviços com hot-reload (`uvicorn --reload` +
# bind mount do código-fonte). Use `docker-compose.prod.yml` em produção —
# lá o Postgres NÃO é containerizado (instância dedicada externa).
#
# Todas as variáveis de ambiente são injetadas a partir de `../../.env.dev`
# (copie `.env.dev.example` -> `.env.dev` na raiz do repositório).
# NENHUMA variável está hardcoded neste arquivo.
#
# Uso:
#   cp .env.dev.example .env.dev
#   docker compose -f infra/docker/docker-compose.dev.yml up -d --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infraestrutura (containers locais, apenas em dev)
  # ---------------------------------------------------------------------------

  postgres-db:
    image: postgres:16-alpine
    container_name: restaurant-postgres-dev
    restart: unless-stopped
    env_file:
      - ../../.env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB__PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ../scripts/create-service-databases.sh:/docker-entrypoint-initdb.d/10-create-service-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: restaurant-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: restaurant-meilisearch-dev
    restart: unless-stopped
    env_file:
      - ../../.env.dev
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV}
    ports:
      - "${MEILI_PORT}:7700"
    volumes:
      - meili_data_dev:/meili_data
    healthcheck:
      # 127.0.0.1 (não "localhost"): a imagem base do Meilisearch resolve
      # "localhost" para ::1 (IPv6) primeiro via /etc/hosts, mas o servidor só
      # escuta em 0.0.0.0 (IPv4) — "localhost" falha com connection refused
      # mesmo com o servidor no ar.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: restaurant-rabbitmq-dev
    restart: unless-stopped
    env_file:
      - ../../.env.dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq

  # ---------------------------------------------------------------------------
  # Microsserviços Python (FastAPI + uv) — todos os 12
  # ---------------------------------------------------------------------------

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ../../.env.dev
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - PORT=${AUTH_SERVICE_PORT}
      - DB__HOST=${DB__HOST}
      - DB__PORT=${DB__PORT}
      - DB__USER=${DB__USER}
      - DB__PASSWORD=${DB__PASSWORD}
      - DB__NAME=${AUTH_DB_NAME}
      - REDIS__HOST=${REDIS_HOST}
      - REDIS__PORT=${REDIS_PORT}
      - REDIS__DB=${AUTH_REDIS_DB}
      - RABBITMQ__HOST=${RABBITMQ_HOST}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USER=${RABBITMQ_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    volumes:
      - ../../services/auth-service/src:/app/services/auth-service/src:ro
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "${AUTH_SERVICE_PORT}", "--reload"]
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      rabbitmq:
        condition: service_started

