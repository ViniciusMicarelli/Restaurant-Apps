# =============================================================================
# DOCKER COMPOSE — AMBIENTE DE PRODUÇÃO — RESTAURANT APPS PLATFORM
# =============================================================================
# Diferenças deliberadas em relação a `docker-compose.dev.yml`:
#   - NENHUM container de PostgreSQL: `DB__HOST`/`DB__PORT` (em `.env.prod`)
#     apontam para uma instância gerenciada/dedicada externa.
#   - Sem bind mount de código-fonte nem `--reload`: roda a imagem já
#     construída (`CMD` padrão do Dockerfile via uvicorn sem --reload).
#   - Serviços não publicam porta no host (`expose`, não `ports`) — apenas o
#     Nginx (`infra/nginx/`) é exposto publicamente, atuando como gateway.
#   - `restart: unless-stopped` + limites de recursos por serviço.
#
# Uso:
#   cp .env.prod.example .env.prod   # preencher com os valores reais
#   docker compose -f infra/docker/docker-compose.prod.yml up -d --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infraestrutura de apoio (Postgres é EXTERNO — ver .env.prod)
  # ---------------------------------------------------------------------------

  redis-cache:
    image: redis:7-alpine
    container_name: restaurant-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: restaurant-meilisearch-prod
    restart: unless-stopped
    env_file:
      - ../../.env.prod
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV}
    volumes:
      - meili_data_prod:/meili_data
    healthcheck:
      # 127.0.0.1 (não "localhost"): a imagem base do Meilisearch resolve
      # "localhost" para ::1 (IPv6) primeiro via /etc/hosts, mas o servidor só
      # escuta em 0.0.0.0 (IPv4) — "localhost" falha com connection refused
      # mesmo com o servidor no ar.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: restaurant-rabbitmq-prod
    restart: unless-stopped
    env_file:
      - ../../.env.prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq

  nginx:
    image: nginx:1.27-alpine
    container_name: restaurant-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - auth-service
      - restaurant-service
      - menu-service
      - dining-service
      - kitchen-service
      - order-service
      - inventory-service
      - payment-service

  # ---------------------------------------------------------------------------
  # Microsserviços Python (FastAPI + uv) — todos os 12, sem porta publicada
  # ---------------------------------------------------------------------------

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    image: restaurant-apps/auth-service:${IMAGE_TAG:-latest}
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ../../.env.prod
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - PORT=${AUTH_SERVICE_PORT}
      - DB__HOST=${DB__HOST}
      - DB__PORT=${DB__PORT}
      - DB__USER=${DB__USER}
      - DB__PASSWORD=${DB__PASSWORD}
      - DB__NAME=${AUTH_DB_NAME}
      - REDIS__HOST=${REDIS_HOST}
      - REDIS__PORT=${REDIS_PORT}
      - REDIS__DB=${AUTH_REDIS_DB}
      - RABBITMQ__HOST=${RABBITMQ_HOST}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USER=${RABBITMQ_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      # Decisão de topologia de deploy, não config de operador — o
      # auth-service em produção só é alcançável via o Nginx do API
      # Gateway (nunca publicado direto, ver "expose" abaixo), então dá
      # pra confiar no X-Forwarded-For que o Nginx acrescenta (revisão de
      # segurança, docs/logs/2026-08-10.md).
      - TRUST_PROXY_HEADERS=true
    expose:
      - "${AUTH_SERVICE_PORT}"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      redis-cache:
        condition: service_healthy
      rabbitmq:
        condition: service_started

