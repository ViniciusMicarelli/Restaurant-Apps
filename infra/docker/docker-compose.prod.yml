      - RABBITMQ__PASSWORD=${RABBITMQ_PASS}
    command: ["python", "-m", "src.consumers.notification_bridge"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      redis-cache:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  scheduler:
    build:
      context: ../..
      dockerfile: workers/Dockerfile
    image: restaurant-apps/workers:${IMAGE_TAG:-latest}
    container_name: scheduler
    restart: unless-stopped
    env_file:
      - ../../.env.prod
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - REDIS__HOST=${REDIS_HOST}
      - REDIS__PORT=${REDIS_PORT}
      - REDIS__DB=${WORKERS_REDIS_DB}
      - RABBITMQ__HOST=${RABBITMQ_HOST}
      - RABBITMQ__PORT=${RABBITMQ_PORT}
      - RABBITMQ__USER=${RABBITMQ_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_PASS}
    command: ["python", "-m", "src.schedulers.daily_report_scheduler"]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    depends_on:
      redis-cache:
        condition: service_healthy

volumes:
  redis_data_prod:
  meili_data_prod:
  rabbitmq_data_prod:
