# Roteamento do API Gateway: /api/v1/<service> -> upstream do microsserviço.
# Nomes de host resolvidos pela rede interna do Docker Compose de produção
# (mesmos nomes de `container_name` em docker-compose.prod.yml).

upstream auth_service        { server auth-service:8000; }
upstream restaurant_service  { server restaurant-service:8001; }
upstream menu_service        { server menu-service:8002; }
upstream dining_service      { server dining-service:8003; }
upstream kitchen_service     { server kitchen-service:8004; }
upstream order_service       { server order-service:8005; }
upstream inventory_service   { server inventory-service:8006; }
upstream payment_service     { server payment-service:8007; }
upstream delivery_service    { server delivery-service:8008; }
upstream marketing_service   { server marketing-service:8009; }
upstream notification_service { server notification-service:8010; }
upstream analytics_service   { server analytics-service:8011; }

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://auth_service/api/v1/auth/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/v1/restaurant/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://restaurant_service/api/v1/restaurant/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/v1/menu/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://menu_service/api/v1/menu/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/v1/dining/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://dining_service/api/v1/dining/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/v1/kitchen/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://kitchen_service/api/v1/kitchen/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # WebSocket do KDS (Kitchen Display System) — precisa do upgrade de protocolo.
    location /ws/v1/kitchen/ {
        proxy_pass http://kitchen_service/ws/v1/kitchen/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/v1/orders/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://order_service/api/v1/orders/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/v1/inventory/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://inventory_service/api/v1/inventory/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/v1/payments/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://payment_service/api/v1/payments/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/v1/delivery/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://delivery_service/api/v1/delivery/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/v1/marketing/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://marketing_service/api/v1/marketing/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/v1/notifications/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://notification_service/api/v1/notifications/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/v1/analytics/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://analytics_service/api/v1/analytics/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
