# Configuração principal do Nginx — API Gateway da Restaurant Apps Platform.
# Usado apenas em produção (docker-compose.prod.yml); em dev cada serviço é
# acessado diretamente na sua porta (ver .env.dev VITE_*_URL).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    # Rate limiting global (docs/SECURITY.md): API pública, 100 req/min/tenant
    # aproximado via IP (o limite fino por tenant_id é aplicado na aplicação).
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    include /etc/nginx/conf.d/*.conf;
}
