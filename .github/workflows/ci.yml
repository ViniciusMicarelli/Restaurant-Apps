# CI — Restaurant Apps Platform.
#
# Espelha a pipeline já documentada em docs/deploy/infrastructure_strategy.md
# (§ CI/CD): lint + type-check + testes de cada serviço/pacote/app, depois
# build de imagem Docker (sem push) como validação final. Roda em PR contra
# `staging`/`main` e em push direto pra essas duas branches ("teste de build
# na staging e na main").
#
# Testes de integração Python usam SQLite em memória (ver
# `services/*/tests/integration/conftest.py`) — não precisam de um Postgres
# real no runner.

name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `dorny/paths-filter` (job `changes`) cai pro fallback via API REST quando
# `actions/checkout` não traz histórico suficiente pra um `git diff` local
# (checkout raso, `fetch-depth` padrão = 1) — esse fallback lista os
# arquivos alterados do PR via API, que precisa de `pull-requests: read`.
# Sem essa permissão explícita, o `GITHUB_TOKEN` default do repo (o
# workflow não declarava `permissions:` nenhuma) falhou com "Resource not
# accessible by integration" — achado no primeiro PR real depois de
# adicionar o filtro.
permissions:
  contents: read
  pull-requests: read

env:
  UV_VERSION: "0.5.x"
  PYTHON_VERSION: "3.12"
  # `npm ci` falhava só no CI ("Missing: esbuild@... from lock file") pro
  # bump do vitest — reproduzido local: com Node 20 (npm ~10.x bundled) o
  # `npm ci` rejeita um lockfile gerado por um npm mais novo; com Node 24
  # (npm 11.13.0, o que já está instalado localmente) o mesmo lockfile
  # instala limpo. Não era o lockfile que estava errado, era o Node do
  # runner desatualizado em relação ao que gera os lockfiles hoje.
  NODE_VERSION: "24"
  # Pubspec dos 2 apps exige `sdk: ^3.12.1` (Dart) — precisa de um Flutter
  # que já embarque esse Dart (confirmado local: Flutter 3.44.1 -> Dart
  # 3.12.1). Achado ao vivo no primeiro CI real: "3.24.x" (bundla Dart
  # 3.5.x) falha a resolução de dependências antes mesmo de rodar nada.
  FLUTTER_VERSION: "3.44.x"

jobs:
  # ---------------------------------------------------------------------------
  # Detecta o que mudou — sem isso, todo PR (mesmo um bump de dependência
  # trocando 1 arquivo) dispara os 38 jobs inteiros. Achado ao vivo: os 39
  # PRs do Dependabot lotaram a fila de concorrência do Actions rodando
  # tudo pra tudo. `changes` (saída padrão do `dorny/paths-filter`) é um
  # array JSON com o nome de todo filtro que bateu — cada job/matriz abaixo
  # só roda de verdade se o nome dele (`matrix.name`, igual ao nome do
  # filtro correspondente) estiver nesse array, ou se algo "amplo" mudou
  # (lockfile único do workspace, ou o workflow em si).
  # ---------------------------------------------------------------------------
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
      any_python: ${{ steps.filter.outputs.any_python }}
      python_shared: ${{ steps.filter.outputs.python_shared }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            any_python:
              - 'services/**'
              - 'packages/**'
              - 'workers/**'
              - 'pyproject.toml'
              - 'uv.lock'
            python_shared:
              - 'pyproject.toml'
              - 'uv.lock'
            auth-service:
              - 'services/auth-service/**'
            restaurant-service:
              - 'services/restaurant-service/**'
            menu-service:
              - 'services/menu-service/**'
            dining-service:
              - 'services/dining-service/**'
            kitchen-service:
              - 'services/kitchen-service/**'
            order-service:
              - 'services/order-service/**'
            inventory-service:
              - 'services/inventory-service/**'
            payment-service:
              - 'services/payment-service/**'
            delivery-service:
              - 'services/delivery-service/**'
            marketing-service:
              - 'services/marketing-service/**'
            notification-service:
              - 'services/notification-service/**'
            analytics-service:
              - 'services/analytics-service/**'
            workers:
              - 'workers/**'
            restaurant-core:
              - 'packages/core/**'
            restaurant-security:
              - 'packages/security/**'
            restaurant-database:
              - 'packages/database/**'
            restaurant-common:
              - 'packages/common/**'
            restaurant-events:
              - 'packages/events/**'
            admin-web:
              - 'apps/admin-web/**'
            customer-web:
              - 'apps/customer-web/**'
            waiter-mobile:
              - 'apps/waiter-mobile/**'
            customer-mobile:
              - 'apps/customer-mobile/**'

  # ---------------------------------------------------------------------------
  # Lint (uma vez só pro workspace inteiro — ruff é rápido e não é escopado
  # por pacote, evita repetir a mesma varredura 17x na matriz abaixo).
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.any_python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # ---------------------------------------------------------------------------
  # Type-check + testes — um job por serviço/pacote/worker (matriz).
  # `pytest` sempre roda de dentro de `matrix.dir` (cada projeto resolve
  # sua própria config via `pyproject.toml` local).
  #
  # `mypy` tem DOIS estilos de invocação, dependendo da categoria — não dá
  # pra unificar num só, os dois foram testados ao vivo (local, reproduzindo
  # o runner) e um quebra o outro:
  #   - Serviços/`workers` (código interno usa `from src.x import y`,
  #     prefixo "src." literal): `cd <dir> && mypy --strict src` — rodar
  #     da RAIZ com o path completo (`mypy --strict services/x/src`)
  #     resolve esse import errado nalguns casos (achado em `workers`:
  #     dispara erros de tipo que não existem rodando do jeito certo).
  #   - Pacotes compartilhados (`restaurant_core` etc., sem prefixo
  #     "src."): o INVERSO — `cd packages/x && mypy --strict src` quebra
  #     ("Source file found twice", mypy descobre o mesmo arquivo com dois
  #     nomes de módulo via `mypy_path` da raiz); só funciona rodado da
  #     raiz com o path completo até o pacote (`mypy --strict
  #     packages/x/src/restaurant_x`). `mypy_target` fica vazio nos outros
  #     — é o que decide qual dos dois passos abaixo roda.
  # ---------------------------------------------------------------------------
  python-services:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: changes
    # Gate do JOB: roda pelo menos a etapa de setup se algo Python (de
    # qualquer serviço/pacote) ou o workflow mudou. Qual ENTRADA da matriz
    # faz trabalho de verdade é decidido por entrada, nos `if:` dos passos
    # abaixo (`contains(changes, matrix.name)`) — sem isso, um bump que só
    # mexe em `services/auth-service` ainda rodaria mypy/pytest dos outros
    # 17 à toa.
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.any_python == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- 12 microsserviços + workers (estilo "cd + src") ----------------
          - { name: auth-service, dir: services/auth-service, mypy_target: "" }
          - { name: restaurant-service, dir: services/restaurant-service, mypy_target: "" }
          - { name: menu-service, dir: services/menu-service, mypy_target: "" }
          - { name: dining-service, dir: services/dining-service, mypy_target: "" }
          - { name: kitchen-service, dir: services/kitchen-service, mypy_target: "" }
          - { name: order-service, dir: services/order-service, mypy_target: "" }
          - { name: inventory-service, dir: services/inventory-service, mypy_target: "" }
          - { name: payment-service, dir: services/payment-service, mypy_target: "" }
          - { name: delivery-service, dir: services/delivery-service, mypy_target: "" }
          - { name: marketing-service, dir: services/marketing-service, mypy_target: "" }
          - { name: notification-service, dir: services/notification-service, mypy_target: "" }
          - { name: analytics-service, dir: services/analytics-service, mypy_target: "" }
          - { name: workers, dir: workers, mypy_target: "" }
          # --- pacotes compartilhados (estilo "raiz + path completo") ---------
          - { name: restaurant-core, dir: packages/core, mypy_target: packages/core/src/restaurant_core }
          - { name: restaurant-security, dir: packages/security, mypy_target: packages/security/src/restaurant_security }
          - { name: restaurant-database, dir: packages/database, mypy_target: packages/database/src/restaurant_database }
          - { name: restaurant-common, dir: packages/common, mypy_target: packages/common/src/restaurant_common }
          - { name: restaurant-events, dir: packages/events, mypy_target: packages/events/src/restaurant_events }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # Workspace uv compartilha UM `.venv` na raiz — sem isso, `uv run`
      # dentro de `matrix.dir` só resolve as deps daquele membro, sem os
      # dev-dependencies da raiz (mypy/pytest/ruff) que os passos abaixo
      # precisam. Localmente isso passava despercebido porque a raiz já
      # tinha sido sincronizada antes em algum momento da sessão; num
      # runner novo (CI) o `.venv` não existe ainda — precisa sincronizar
      # explicitamente primeiro (mesmo passo que o job `lint` já fazia).
      # `--all-packages` (não só a raiz): o mypy dos 5 pacotes compartilhados
      # roda a partir da raiz (ver comentário acima) — sem essa flag, o
      # `uv sync` sozinho só instala as deps do projeto raiz (`dependencies
      # = []`, vazio), nunca as de cada pacote (`pydantic`, que o próprio
      # `[tool.mypy] plugins = ["pydantic.mypy"]` da raiz precisa carregar).
      # Os serviços não sofriam disso porque `cd services/x && uv run` já
      # sincroniza aquele membro específico sozinho — só os pacotes,
      # invocados da raiz, dependiam de tudo já estar instalado de antemão.
      - name: Sync workspace (.venv compartilhado)
        run: uv sync --frozen --all-packages
      # A entrada da matriz só faz trabalho de verdade se o workflow, o
      # `uv.lock`/`pyproject.toml` raiz (afeta todo mundo), ou o diretório
      # específico deste membro (`matrix.name`, mesmo nome do filtro em
      # `changes`) mudou — senão os passos abaixo viram no-op (sucesso
      # instantâneo, não consome tempo de fila de verdade).
      - name: mypy --strict (serviço/worker)
        if: >-
          matrix.mypy_target == '' && (
            needs.changes.outputs.workflows == 'true' ||
            needs.changes.outputs.python_shared == 'true' ||
            contains(fromJSON(needs.changes.outputs.changes), matrix.name)
          )
        working-directory: ${{ matrix.dir }}
        run: uv run mypy --strict src
      - name: mypy --strict (pacote compartilhado)
        if: >-
          matrix.mypy_target != '' && (
            needs.changes.outputs.workflows == 'true' ||
            needs.changes.outputs.python_shared == 'true' ||
            contains(fromJSON(needs.changes.outputs.changes), matrix.name)
          )
        run: uv run mypy --strict ${{ matrix.mypy_target }}
      - name: pytest
        if: >-
          needs.changes.outputs.workflows == 'true' ||
          needs.changes.outputs.python_shared == 'true' ||
          contains(fromJSON(needs.changes.outputs.changes), matrix.name)
        working-directory: ${{ matrix.dir }}
        run: uv run pytest

  # ---------------------------------------------------------------------------
  web-apps:
    name: ${{ matrix.name }} (build + test)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.workflows == 'true' ||
      contains(fromJSON(needs.changes.outputs.changes), 'admin-web') ||
      contains(fromJSON(needs.changes.outputs.changes), 'customer-web')
    strategy:
      fail-fast: false
      matrix:
        name: [admin-web, customer-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.workflows == 'true' || contains(fromJSON(needs.changes.outputs.changes), matrix.name)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.name }}/package-lock.json
      - name: npm ci
        if: needs.changes.outputs.workflows == 'true' || contains(fromJSON(needs.changes.outputs.changes), matrix.name)
        working-directory: apps/${{ matrix.name }}
        run: npm ci
      - name: Build (tsc + vite build)
        if: needs.changes.outputs.workflows == 'true' || contains(fromJSON(needs.changes.outputs.changes), matrix.name)
        working-directory: apps/${{ matrix.name }}
        run: npm run build
      - name: Test (vitest)
        if: needs.changes.outputs.workflows == 'true' || contains(fromJSON(needs.changes.outputs.changes), matrix.name)
        working-directory: apps/${{ matrix.name }}
        run: npm test

  # ---------------------------------------------------------------------------
  flutter-apps:
    name: ${{ matrix.name }} (analyze + test)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.workflows == 'true' ||
      contains(fromJSON(needs.changes.outputs.changes), 'waiter-mobile') ||
      contains(fromJSON(needs.changes.outputs.changes), 'customer-mobile')
    strategy:
      fail-fast: false
      matrix:
        name: [waiter-mobile, customer-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: needs.changes.outputs.workflows == 'true' || contains(fromJSON(needs.changes.outputs.changes), matrix.name)
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: flutter pub get
        if: needs.changes.outputs.workflows == 'true' || contains(fromJSON(needs.changes.outputs.changes), matrix.name)
        working-directory: apps/${{ matrix.name }}
        run: flutter pub get
      - name: flutter analyze
        if: needs.changes.outputs.workflows == 'true' || contains(fromJSON(needs.changes.outputs.changes), matrix.name)
        working-directory: apps/${{ matrix.name }}
        run: flutter analyze
      - name: flutter test
        if: needs.changes.outputs.workflows == 'true' || contains(fromJSON(needs.changes.outputs.changes), matrix.name)
        working-directory: apps/${{ matrix.name }}
        run: flutter test

  # ---------------------------------------------------------------------------
  # Build de imagem Docker de cada serviço/app — sem push (validação de que
  # os Dockerfiles continuam corretos, mesmo passo já documentado em
  # docs/deploy/infrastructure_strategy.md). Só roda depois que lint/
  # type-check/testes passarem.
  # ---------------------------------------------------------------------------
  docker-build:
    name: docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [changes, lint, python-services, web-apps]
    # `needs.<job>.result` em vez do `if: success()` implícito: com o
    # filtro de mudanças, `lint`/`python-services`/`web-apps` ficam
    # "skipped" (não "success") em PRs que não mexem em nada deles — o
    # `if:` padrão trataria "skipped" como bloqueio e `docker-build`
    # nunca rodaria num bump só de Dockerfile/Flutter. `always()` +
    # aceitar success OU skipped em cada um resolve isso.
    if: >-
      always() &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.python-services.result == 'success' || needs.python-services.result == 'skipped') &&
      (needs.web-apps.result == 'success' || needs.web-apps.result == 'skipped') &&
      (
        needs.changes.outputs.workflows == 'true' ||
        needs.changes.outputs.any_python == 'true' ||
        contains(fromJSON(needs.changes.outputs.changes), 'admin-web') ||
        contains(fromJSON(needs.changes.outputs.changes), 'customer-web')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-service, dockerfile: services/auth-service/Dockerfile }
          - { name: restaurant-service, dockerfile: services/restaurant-service/Dockerfile }
          - { name: menu-service, dockerfile: services/menu-service/Dockerfile }
          - { name: dining-service, dockerfile: services/dining-service/Dockerfile }
          - { name: kitchen-service, dockerfile: services/kitchen-service/Dockerfile }
          - { name: order-service, dockerfile: services/order-service/Dockerfile }
          - { name: inventory-service, dockerfile: services/inventory-service/Dockerfile }
          - { name: payment-service, dockerfile: services/payment-service/Dockerfile }
          - { name: delivery-service, dockerfile: services/delivery-service/Dockerfile }
          - { name: marketing-service, dockerfile: services/marketing-service/Dockerfile }
          - { name: notification-service, dockerfile: services/notification-service/Dockerfile }
          - { name: analytics-service, dockerfile: services/analytics-service/Dockerfile }
          - { name: workers, dockerfile: workers/Dockerfile }
          - { name: admin-web, dockerfile: apps/admin-web/Dockerfile }
          - { name: customer-web, dockerfile: apps/customer-web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        if: >-
          needs.changes.outputs.workflows == 'true' ||
          needs.changes.outputs.python_shared == 'true' ||
          contains(fromJSON(needs.changes.outputs.changes), matrix.name)
      - uses: docker/build-push-action@v6
        if: >-
          needs.changes.outputs.workflows == 'true' ||
          needs.changes.outputs.python_shared == 'true' ||
          contains(fromJSON(needs.changes.outputs.changes), matrix.name)
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
