[project]
name = "restaurant-security"
version = "0.1.0"
description = "Pacote de segurança com criptografia, hash Argon2id, JWT, contexto de tenant e RBAC"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.13.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "starlette>=0.36.0",
    "redis>=5.0.0",
    "restaurant-core",
]

[tool.uv.sources]
restaurant-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restaurant_security"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
