[project]
name = "restaurant-database"
version = "0.1.0"
description = "Pacote de infraestrutura de banco de dados com SQLAlchemy 2.0 Async Engine, Alembic e RLS"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.19.1",
    "pydantic>=2.7.0",
    "restaurant-core",
]

[tool.uv.sources]
restaurant-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restaurant_database"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
