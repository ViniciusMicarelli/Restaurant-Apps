[project]
name = "restaurant-core"
version = "0.1.0"
description = "Pacote core compartilhado com tipos primitivos, exceções e contratos base"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restaurant_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
