[project]
name = "restaurant-common"
version = "0.1.0"
description = "DTOs, settings base e utilitários compartilhados entre todos os microsserviços"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "fastapi>=0.110.0",
    "restaurant-core",
]

[tool.uv.sources]
restaurant-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restaurant_common"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
